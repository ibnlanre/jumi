<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jumi · view transitions — to</title>
    <style>
      @view-transition { navigation: auto; }

      body { margin: 0; font: 600 14px/1.2 system-ui, sans-serif; }
      main { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
      .tile {
        border-radius: 12px; color: #fff; display: grid;
        height: 96px; place-items: center; width: 96px;
      }
      /* Moved, so a shared element has somewhere to travel to and the group's own animation has a
         reason to exist. The travel is the browser's, and nothing here touches it. */
      .hero { background: #db2777; margin-left: 260px; margin-top: 72px; }
      .card { background: #0d9488; margin-left: 140px; }
      .mixed { background: #7c3aed; margin-left: 60px; margin-top: 40px; }
      .inert { background: #64748b; }
      a { color: #4f46e5; font-weight: 700; }
    </style>
    <link rel="stylesheet" href="/jumi.css" />
  </head>
  <body>
    <main>
      <div class="tile hero motion-safe:view-transition-old/hero:animate-fade-out motion-safe:view-transition-new/hero:animate-fade-in">hero</div>
      <div class="tile card sm:view-transition-old/card:animate-fade-out sm:view-transition-new/card:animate-fade-in">card</div>
      <div class="tile mixed sm:view-transition-old/mixed:animate-fade-out view-transition-new/mixed:animate-fade-in">mixed</div>
      <div class="tile inert view-transition-old/inert:animation-duration-300">control only</div>
      <a id="back" href="/from.html">back</a>
    </main>
  </body>
</html>
