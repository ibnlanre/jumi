<!doctype html>
<html>
  <head><meta charset="utf-8"><title>K curve</title></head>
  <body>
    <div id="host"></div>
    <script>const PARTS = ["animation-name","animation-duration","animation-delay","animation-composition","animation-direction","animation-fill-mode","animation-iteration-count","animation-play-state","animation-timeline","animation-timing-function"]
const entry = (slot, part) =>
  part === 'animation-name'
    ? `var(--jumi-slot${slot}-animation-name, var(--jumi-animation-name))`
    : `var(--jumi-slot${slot}-${part}, var(--jumi-animation-${part}))`
const slotStyles = slots =>
  Array.from({ length: slots }, (_, i) => `
  .slot-${i} {
    --jumi-slot${i}-animation-name: jumi-slot${i};
    ${PARTS.filter(p => p !== 'animation-name').map(p => `--jumi-slot${i}-${p}: var(--jumi-animation-${p});`).join('')}
  }`).join('')
const list = (slots, part) => Array.from({ length: slots }, (_, i) => entry(i, part)).join(', ')
const aggregateData = slots =>
  PARTS.map(part => `--jumi-aggregate-${part}: ${list(slots, part)};`).join('\n    ')
const consumers = target => `
  ${target} {
    ${PARTS.map(part => `${part}: var(--jumi-aggregate-${part}, var(--jumi-animation-${part}));`).join('\n    ')}
  }`
const inline = (slots, target) => `
  ${target} {
    ${PARTS.map(part => `${part}: ${list(slots, part)};`).join('\n    ')}
  }`
const carrier = (slots, target) => `
  ${target} {
    ${aggregateData(slots)}
  }
  ${consumers(target)}`
const rootInvalid = (slots, target) => `
  :root {
    ${aggregateData(slots)}
  }
  ${consumers(target)}`
const node = (slots, K, n) =>
  PARTS.map((part) => {
    const from = n * K
    const entries = Array.from(
      { length: Math.min(K, slots - from) },
      (_, j) => entry(from + j, part),
    ).join(', ')

    return `--jumi-link${n}-${part}: ${n === 0 ? entries : `var(--jumi-link${n - 1}-${part}), ${entries}`};`
  }).join('\n    ')
const linksFor = (slots, K) => Math.ceil(slots / K)
const linked = (slots, target, K) => `
  ${target} {
    ${Array.from({ length: linksFor(slots, K) }, (_, n) => node(slots, K, n)).join('\n    ')}
    ${PARTS.map(part => `--jumi-aggregate-${part}: var(--jumi-link${linksFor(slots, K) - 1}-${part});`).join('\n    ')}
  }
  ${consumers(target)}`
const REPRESENTATIONS = { carrier, inline, linked, rootInvalid }
const targetFor = shape => (shape === 'descendants' ? '.animations > *' : '.animations')
const css = (representation, slots, shape, K = 1) => `
  ${slotStyles(slots)}
  ${REPRESENTATIONS[representation](slots, targetFor(shape), K)}
  .on { --jumi-animation-duration: 2s; }
`
const PLAN = [{"carriers":1,"label":"1 carrier · 228 slots","shape":"direct","slots":228,"K":1,"representation":"carrier"},{"carriers":1,"label":"1 carrier · 228 slots","shape":"direct","slots":228,"K":1,"representation":"linked"},{"carriers":1,"label":"1 carrier · 228 slots","shape":"direct","slots":228,"K":4,"representation":"linked"},{"carriers":1,"label":"1 carrier · 228 slots","shape":"direct","slots":228,"K":8,"representation":"linked"},{"carriers":1,"label":"1 carrier · 228 slots","shape":"direct","slots":228,"K":16,"representation":"linked"},{"carriers":1,"label":"1 carrier · 228 slots","shape":"direct","slots":228,"K":32,"representation":"linked"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":1,"representation":"carrier"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":1,"representation":"inline"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":1,"representation":"linked"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":4,"representation":"linked"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":8,"representation":"linked"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":16,"representation":"linked"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":32,"representation":"linked"},{"carriers":200,"label":"200 carriers · 228 slots","shape":"direct","slots":228,"K":1,"representation":"rootInvalid"},{"carriers":200,"label":"200 carriers · 60 slots","shape":"direct","slots":60,"K":1,"representation":"carrier"},{"carriers":200,"label":"200 carriers · 60 slots","shape":"direct","slots":60,"K":1,"representation":"linked"},{"carriers":200,"label":"200 carriers · 60 slots","shape":"direct","slots":60,"K":4,"representation":"linked"},{"carriers":200,"label":"200 carriers · 60 slots","shape":"direct","slots":60,"K":8,"representation":"linked"},{"carriers":200,"label":"200 carriers · 60 slots","shape":"direct","slots":60,"K":16,"representation":"linked"},{"carriers":200,"label":"200 carriers · 60 slots","shape":"direct","slots":60,"K":32,"representation":"linked"},{"carriers":200,"label":"200 descendants · 228 slots","shape":"descendants","slots":228,"K":1,"representation":"carrier"},{"carriers":200,"label":"200 descendants · 228 slots","shape":"descendants","slots":228,"K":1,"representation":"linked"},{"carriers":200,"label":"200 descendants · 228 slots","shape":"descendants","slots":228,"K":4,"representation":"linked"},{"carriers":200,"label":"200 descendants · 228 slots","shape":"descendants","slots":228,"K":8,"representation":"linked"},{"carriers":200,"label":"200 descendants · 228 slots","shape":"descendants","slots":228,"K":16,"representation":"linked"},{"carriers":200,"label":"200 descendants · 228 slots","shape":"descendants","slots":228,"K":32,"representation":"linked"}]

const median = (values) => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)]

/** How many names the last element actually resolves. 0 means the arm is not functional. */
const resolvedNames = (element) =>
  getComputedStyle(element).animationName.split(',').filter(name => name.trim() !== 'none').length

const time = (work) => {
  const start = performance.now()
  work()
  // Reading layout forces the style pass the work invalidated.
  void document.body.offsetHeight
  return performance.now() - start
}

const dom = (carriers, slots, shape) => {
  const host = document.getElementById('host')
  const slotClasses = Array.from({ length: slots }, (_, i) => `slot-${i}`).join(' ')

  if (shape === 'descendants') {
    host.innerHTML = `<div class="animations">${Array.from({ length: carriers }, () => `<i class="${slotClasses}"></i>`).join('')}</div>`
    return [...document.querySelectorAll('.animations > *')]
  }

  host.innerHTML = Array.from({ length: carriers }, () => `<div class="animations ${slotClasses}"></div>`).join('')
  return [...document.querySelectorAll('.animations')]
}

/** One cell: a fresh document state, then the two invalidation shapes. */
const cell = (plan, repeats) => {
  const { carriers, K, representation, shape, slots } = plan
  const host = document.getElementById('host')
  const initial = []
  const single = []
  const forced = []
  let resolved = 0

  for (let run = 0; run < repeats; run += 1) {
    // Fresh state: no stylesheet, no DOM.
    host.innerHTML = ''
    document.querySelectorAll('style.bench').forEach(style => style.remove())

    const style = document.createElement('style')
    style.className = 'bench'
    style.textContent = css(representation, slots, shape, K)
    document.head.append(style)

    const elements = dom(carriers, slots, shape)
    resolved = resolvedNames(elements[elements.length - 1])

    initial.push(time(() => {
      for (const element of elements) getComputedStyle(element).animationName
    }))

    // The design's own mutation model: one carrier changes.
    single.push(time(() => {
      const element = elements[elements.length - 1]
      element.classList.toggle('on')
      getComputedStyle(element).animationName
    }))

    // The adversarial case: a variant-style change on every carrier at once.
    forced.push(time(() => {
      for (const element of elements) element.classList.toggle('on')
      for (const element of elements) getComputedStyle(element).animationName
    }))
  }

  host.innerHTML = ''
  document.querySelectorAll('style.bench').forEach(style => style.remove())

  return { ...plan, forced: median(forced), initial: median(initial), resolved, single: median(single) }
}

window.runBenchmark = (repeats = 5) =>
  JSON.stringify({
    results: PLAN.map(plan => cell(plan, repeats)),
    ua: navigator.userAgent.match(/(Chrome\/[\d.]+)/)?.[1] ?? navigator.userAgent.slice(0, 40),
  })
</script>
  </body>
</html>
