<!doctype html>
<html>
  <body>
    <!--
      A frozen, representative candidate corpus for the CSS snapshot.
      Every shape Jumi can produce should appear here at least once: bare tweens,
      theme-backed tweens, phrases, labelled phrases, every control that writes a
      slot link, stagger, transitions, and the variant forms.

      Keep this file boring. It exists to detect a change in the emitted CSS, so a
      new feature adds a line here and refreshes the snapshot deliberately.
    -->
    <div class="orbit animations animate-rotate-360 animation-duration-[24s] animation-timing-function-linear animation-iteration-count-infinite">
      <div class="petal-position animations
        animate-rotate-[0:var(--angle),100:calc(var(--angle)_-_360deg)]
        animation-duration-[75s]
        animation-timing-function-linear
        animation-iteration-count-infinite">
        <div class="petal animations
          animate-rotate-[0:0deg,20:-8deg,100:-8deg]/[flick]
          animate-rotate-[0:0deg,20:0deg,100:8deg]/[return]
          animation-composition-add/rotate
          animation-duration-[3000ms]
          animation-timing-function-[cubic-bezier(.4,0,.6,1)]/[flick]
          animation-timing-function-linear/[return]
          animation-iteration-count-infinite"></div>
      </div>
    </div>

    <div class="animations animate-rotate-45 animate-scale-110 animation-opacity-50 animation-duration-500/rotate animation-duration-1200/scale animation-direction-alternate animation-fill-mode-forwards animation-iteration-count-infinite"></div>

    <!--
      One spacing-keyed utility, because the theme the batch owns has to appear in the corpus or
      the change is invisible: `animate-padding-4` is `calc(var(--spacing) * 4)`, which follows the
      `--spacing` override in `input.css`. A literal `1rem` here would be a regression the snapshot
      could not see.
    -->
    <div id="spacing" class="animations animate-padding-4 animate-margin-2"></div>

    <div class="animations animate-accent-color-amber-400 animate-scale-y-[0.2] animation-play-state-paused animation-delay-150"></div>

    <div class="animations animate-bounce-in animate-fade-in animate-shake animation-duration-[1200ms]"></div>

    <div class="animations animate-rotate-[180deg] animate-rotate-[0:16deg,58:0deg] animate-opacity-[0:1,50:0.5,100:1] animate-scale-[0:0.42_0.30,50:1.03_1.03] animation-composition-add animation-delay-0/rotate"></div>

    <div class="bars animate-stagger-forward-[120ms]/7">
      <i class="animations animate-scale-y-[0.2]"></i>
      <i class="animations animate-scale-y-[0.2]"></i>
      <i class="animations animate-scale-y-[0.2]"></i>
    </div>

    <div class="animations animate-stagger-backward-150 transitions transition-duration-500/background-color transition-delay-150 transition-behavior-allow-discrete"></div>

    <div class="animations motion-safe:animate-fade-in motion-reduce:animate-fade-in hover:animate-scale-110 sm:animate-rotate-45"></div>

    <!-- Prefixed carrier forms live in variant.html: they sort before every
         `animate-*` candidate, which is the path where publication is quadratic.
         Keeping them out of this corpus keeps its byte metric readable. -->
    <div class="animations not-sm:animate-accent-color-amber-400 is-[h1]:animate-fade-in has-[>button]:animate-scale-110"></div>

    <!-- The carrier applied instead of classed: see input.css. -->
    <div class="applied-motion"></div>

    <!-- Theme resolution: every colour key plus `letterSpacing`, one bare
         `animate-border-color` for the token-less `DEFAULT`, and two `animate-fill`
         names Jumi owns rather than the host (`theme('colors', fill)`). -->
    <div class="animations animate-accent-color-amber-400 animate-background-color-red-500 animate-background-color-brand animate-border-color animate-box-shadow-color-lime-500 animate-caret-color-blue-500 animate-letter-spacing-tight animate-outline-color-rose-500 animate-fill-none animate-fill-context-fill"></div>
  </body>
</html>
