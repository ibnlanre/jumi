<!doctype html>
<html>
  <body>
    <!--
      A frozen, representative candidate corpus for the CSS snapshot.
      Every shape Jumi can produce should appear here at least once: bare tweens,
      theme-backed tweens, phrases, labelled phrases, every control that writes a
      slot link, stagger, transitions, and the variant forms.

      Every element that animates says so with a motion utility and nothing else.
      There is no opt-in class: the composition is inferred from these rules, so a
      corpus that reads like ordinary Jumi markup is the whole contract.

      Keep this file boring. It exists to detect a change in the emitted CSS, so a
      new feature adds a line here and refreshes the snapshot deliberately.
    -->
    <div
      class="orbit animate-rotate-360 animation-duration-[24s] animation-timing-function-linear animation-iteration-count-infinite"
    >
      <div
        class="petal-position animate-rotate-[0:var(--angle)|100:calc(var(--angle)_-_360deg)] animation-duration-[75s] animation-timing-function-linear animation-iteration-count-infinite"
      >
        <div
          class="petal animate-rotate-[0:0deg|20:-8deg|100:-8deg]/[flick] animate-rotate-[0:0deg|20:0deg|100:8deg]/[return] animation-composition-add/rotate animation-duration-[3000ms] animation-timing-function-[cubic-bezier(.4,0,.6,1)]/[flick] animation-timing-function-linear/[return] animation-iteration-count-infinite"
        ></div>
      </div>
    </div>

    <div
      class="animate-rotate-45 animate-scale-110 animation-opacity-50 animation-duration-500/rotate animation-duration-1200/scale animation-direction-alternate animation-fill-mode-forwards animation-iteration-count-infinite"
    ></div>

    <!--
      One spacing-keyed utility, because the theme the batch owns has to appear in the corpus or
      the change is invisible: `animate-padding-4` is `calc(var(--spacing) * 4)`, which follows the
      `--spacing` override in `input.css`. A literal `1rem` here would be a regression the snapshot
      could not see.
    -->
    <div
      id="spacing"
      class="animate-padding-4 animate-margin-2"
    ></div>

    <div
      class="animate-accent-color-amber-400 animate-scale-y-[0.2] animation-play-state-paused animation-delay-150"
    ></div>

    <div
      class="animate-bounce-in animate-fade-in animate-shake animation-duration-[1200ms]"
    ></div>

    <div
      class="animate-rotate-[180deg] animate-rotate-[0:16deg|58:0deg] animate-opacity-[0:1|50:0.5|100:1] animate-scale-[0:0.42_0.30|50:1.03_1.03] animation-composition-add animation-delay-0/rotate"
    ></div>

    <div class="bars animate-stagger-forward-[120ms]/7">
      <i class="animate-scale-y-[0.2]"></i>
      <i class="animate-scale-y-[0.2]"></i>
      <i class="animate-scale-y-[0.2]"></i>
    </div>

    <div
      class="animate-stagger-backward-150 transition-duration-500/background-color transition-delay-150 transition-behavior-allow-discrete"
    ></div>

    <div
      class="motion-safe:animate-fade-in motion-reduce:animate-fade-in hover:animate-scale-110 sm:animate-rotate-45"
    ></div>

    <!--
      The substrate's precedence triangle. `behaviour:check` asserts the resolved winner in a real
      browser at each step — the default this pass writes, a Jumi control over it, and an arbitrary
      custom property over both — and that assertion is only meaningful if the corpus carries the
      classes. `[--jumi-animation-duration:750ms]` is deliberate rather than decorative: it is
      whether Tailwind emits an arbitrary custom property as a utility at all, which is measured
      here rather than assumed.
    -->
    <div class="animate-rotate-45"></div>
    <div class="animate-rotate-45 animation-duration-500"></div>
    <div class="animate-rotate-45 [--jumi-animation-duration:750ms]"></div>

    <!-- Prefixed activation forms live in variant.html: they resolve to selectors with
         pseudo-elements, descendant combinators and nested conditions, which is a different
         shape of output. Keeping them out of this corpus keeps its byte metric readable. -->
    <div
      class="not-sm:animate-accent-color-amber-400 [&:is(h1)]:animate-fade-in has-[>button]:animate-scale-110"
    ></div>

    <!-- The motion applied instead of classed: see input.css. -->
    <div class="applied-motion"></div>

    <!-- Theme resolution: every colour key plus `letterSpacing`, one bare
         `animate-border-color` for the token-less `DEFAULT`, and two `animate-fill`
         names Jumi owns rather than the host (`theme('colors', fill)`). -->
    <div
      class="animate-accent-color-amber-400 animate-background-color-red-500 animate-background-color-brand animate-border-color animate-box-shadow-color-lime-500 animate-caret-color-blue-500 animate-letter-spacing-tight animate-outline-color-rose-500 animate-fill-none animate-fill-context-fill"
    ></div>

    <!-- Partial scales, one per resolution mode: a token (`animate-border-radius-sm`),
         a spacing formula and a token out of the same key (`animate-line-height-6` beside
         `animate-line-height-tight`, `animate-max-width-4` beside `animate-max-width-xs`),
         and the literal that is left (`animate-box-shadow-sm`, which is *not* a token
         even though `--shadow-*` exists — measured, `shadow-sm` inlines its value).
         `animate-backdrop-filter-blur-sm` is from the closing sweep: a separate key from
         `blur`, borrowing the same `--blur-*` tokens, which only the measurement shows. -->
    <div
      class="animate-border-radius-sm animate-box-shadow-blur-sm animate-backdrop-filter-blur-sm animate-backdrop-filter-drop-shadow-sm animate-line-height-tight animate-line-height-6 animate-max-width-xs animate-max-width-4 animate-box-shadow-sm"
    ></div>

    <!-- Dependency-bearing families, one phrase each. A property whose value template names its own
         components — `--jumi-rotate` is `rotate-x` … `rotate-angle`, `--jumi-margin` is `margin-top` …
         `margin-left` — reaches `propertyKeyframeValue` with those components expanded per frame, and the
         expanded names have no writer. The corpus carried only `rotate` and `scale`, so the class looked
         twice as small as it is: measured, all eight families produce it, 66 reads over 8 phrases.

         This is the fixture `scripts/dead-links.mjs` audits, and the reason it is here rather than in the
         demo page: the canonical corpus is what the writer/read invariant runs on. -->
    <div
      class="animate-rotate-[0:0deg|50:90deg] animate-scale-[0:1|50:1.5] animate-margin-[0:0px|50:8px] animate-padding-[0:0px|50:8px] animate-border-radius-[0:0px|50:8px] animate-box-shadow-[0:0px_0px_black|50:0px_0px_8px_black] animate-outline-color-[0:red|50:blue] animate-backdrop-filter-[0:blur(0px)|50:blur(8px)]"
    ></div>
  </body>
</html>
