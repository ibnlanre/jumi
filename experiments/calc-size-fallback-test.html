<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foreign stop fallback = calc-size(base)</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 40px; background: #f3f4f6; color: #111827; }
      .row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
      .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); min-width: 260px; }
      .card h3 { margin: 0 0 4px; font-size: 15px; }
      .card p.desc { margin: 0 0 12px; color: #6b7280; font-size: 12px; }
      .box { height: 48px; border-radius: 8px; background: #6366f1; }
      .out { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 12px; color: #374151; }
    </style>

    <style>
      /*
        The foreign fallback IS a calc-size: it resolves to the element's
        resting width (--jumi-width), so an unset stop HOLDS at rest instead
        of leaking 0 or ramping to intrinsic auto.
      */
      @keyframes jumi-width {
        5%   { width: var(--jumi-width-5,   calc-size(var(--jumi-width), size)); }
        100% { width: var(--jumi-width-100, calc-size(var(--jumi-width), size)); }
      }

      .a, .b, .c, .d { interpolate-size: allow-keywords; }

      /* every element has a resting width: width:40px AND --jumi-width: 40px */
      .a { width: 40px; --jumi-width: 40px; --jumi-width-100: 100px; animation: jumi-width 4s linear infinite; }
      .b { width: 40px; --jumi-width: 40px; --jumi-width-5: 20px;   animation: jumi-width 4s linear infinite; }
      .c { width: 40px; --jumi-width: 40px; --jumi-width-5: 20px; --jumi-width-100: 100px; animation: jumi-width 4s linear infinite; }
      .d { width: 40px; --jumi-width: 40px; animation: jumi-width 4s linear infinite; }
    </style>
  </head>
  <body>
    <h1>Foreign stop fallback = <code>calc-size(var(--jumi-width), size)</code></h1>
    <div class="row">
      <div class="card"><h3>A — 100% only</h3><p class="desc">Expect: hold 40 until 5%, then 40→100.</p><div class="box a"></div><div class="out" id="out-a"></div></div>
      <div class="card"><h3>B — 5% only</h3><p class="desc">Expect: 40→20 by 5%, then back to 40.</p><div class="box b"></div><div class="out" id="out-b"></div></div>
      <div class="card"><h3>C — both (control)</h3><p class="desc">Expect: 40→20→100.</p><div class="box c"></div><div class="out" id="out-c"></div></div>
      <div class="card"><h3>D — neither</h3><p class="desc">Expect: hold 40 throughout.</p><div class="box d"></div><div class="out" id="out-d"></div></div>
    </div>

    <script>
      const classes = { a: 'A', b: 'B', c: 'C', d: 'D' }
      const out = {}

      async function measure() {
        for (const [cls, label] of Object.entries(classes)) {
          const el = document.querySelector('.' + cls)
          el.style.animation = 'none'
          void el.offsetWidth
          el.style.animation = ''
          await new Promise(r => setTimeout(r, 60))
          const anim = el.getAnimations()[0]
          const series = []
          for (let i = 0; i <= 40; i++) {
            const target = (i / 40) * 4000
            let guard = 0
            while (anim && anim.currentTime < target - 5 && guard < 600) {
              await new Promise(r => setTimeout(r, 5))
              guard++
            }
            series.push(Math.round(parseFloat(getComputedStyle(el).width) * 10) / 10)
          }
          out[label] = series.join(' → ')
          el.style.animation = 'none'
        }
        return out
      }
      window.__run = measure
    </script>
  </body>
</html>
